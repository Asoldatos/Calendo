name: Build Calendo IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Use the correct runner for iOS 26 SDK
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Calendo.xcodeproj \
            -scheme Calendo

      - name: Build Unsigned Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Calendo.xcodeproj \
            -scheme Calendo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Calendo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tee build.log

      - name: Package IPA for AltStore / Sideloadly
        run: |
          mkdir -p Payload
          # Use wildcard just in case the bundle name varies slightly
          cp -R build/Calendo.xcarchive/Products/Applications/*.app Payload/
          zip -r -y Calendo.ipa Payload
          rm -rf Payload
          echo "✅ IPA created: Calendo.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendo-IPA
          path: Calendo.ipa
          retention-days: 90

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
