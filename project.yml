name: Calendo
options:
  bundleIdPrefix: com.calendo
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: el
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: Calendo/Info.plist
    GENERATE_INFOPLIST_FILE: false

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
  GoogleGenerativeAI:
    url: https://github.com/google/generative-ai-swift
    from: "0.5.0"

targets:
  Calendo:
    type: application
    platform: iOS
    sources:
      - path: Calendo
        excludes:
          - "**/*.xcassets"
    resources:
      - path: Calendo/Assets.xcassets
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GoogleGenerativeAI
        product: GoogleGenerativeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Calendo/Info.plist
